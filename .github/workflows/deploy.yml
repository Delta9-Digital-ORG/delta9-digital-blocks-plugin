name: Deploy to WP Engine

on:
  push:
    branches: [main, staging, dev, ggt-staging]
    paths-ignore:
      - '.github/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Dump autoload
        run: composer dump-autoload --optimize

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Remove node_modules before deploy
        run: rm -rf node_modules

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_DEPLOY }}
          WPE_ENV: ${{ vars.WPE_YS_PROD_ENV }}
          SRC_PATH: "."
          REMOTE_PATH: "wp-content/plugins/delta9-digital-blocks-plugin/"
          FLAGS: "-azvr --inplace --exclude-from=.deployignore"
          PHP_LINT: false
          CACHE_CLEAR: true

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_DEPLOY }}
          WPE_ENV: ${{ vars.WPE_YS_STAGING_ENV }}
          SRC_PATH: "."
          REMOTE_PATH: "wp-content/plugins/delta9-digital-blocks-plugin/"
          FLAGS: "-azvr --inplace --exclude-from=.deployignore"
          CACHE_CLEAR: true

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_DEPLOY }}
          WPE_ENV: ${{ vars.WPE_YS_DEV_ENV }}
          SRC_PATH: "."
          REMOTE_PATH: "wp-content/plugins/delta9-digital-blocks-plugin/"
          FLAGS: "-azvr --inplace --exclude-from=.deployignore"
          CACHE_CLEAR: true

      # Going Green Transport (goinggreentstg). ggt-staging carries the GGT integration branch
      # until the GGT PRs merge; GGT production runs from main once vars.WPE_GGT_PROD_ENV is set.
      - name: Deploy to GGT Staging
        if: github.ref == 'refs/heads/ggt-staging'
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_DEPLOY }}
          WPE_ENV: ${{ vars.WPE_GGT_STAGING_ENV }}
          SRC_PATH: "."
          REMOTE_PATH: "wp-content/plugins/delta9-digital-blocks-plugin/"
          FLAGS: "-azvr --inplace --exclude-from=.deployignore"
          CACHE_CLEAR: true

      - name: Deploy to GGT Production
        if: github.ref == 'refs/heads/main' && vars.WPE_GGT_PROD_ENV != ''
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_DEPLOY }}
          WPE_ENV: ${{ vars.WPE_GGT_PROD_ENV }}
          SRC_PATH: "."
          REMOTE_PATH: "wp-content/plugins/delta9-digital-blocks-plugin/"
          FLAGS: "-azvr --inplace --exclude-from=.deployignore"
          PHP_LINT: false
          CACHE_CLEAR: true
